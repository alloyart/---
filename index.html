<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>李氏族谱·春位支系</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#f5f1e8;color:#26231f}header{padding:16px 20px;background:#fffaf2;border-bottom:1px solid #ddd3c2;position:sticky;top:0;z-index:3;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-family:serif;font-size:20px;margin:0}input{flex:1;min-width:220px;padding:10px 12px;border:1px solid #cfc3b2;border-radius:10px}button{padding:9px 12px;border:1px solid #cfc3b2;border-radius:9px;background:white}main{height:calc(100vh - 74px);position:relative;overflow:hidden}svg{width:100%;height:100%;cursor:grab}.node rect{fill:#fffdf8;stroke:#b9aa94;rx:6}.node.direct rect{fill:#e8d7bc;stroke:#8f7654}.node.me rect{fill:#27241f;stroke:#27241f}.node text{font-size:11px;text-anchor:middle;dominant-baseline:middle;pointer-events:none}.node.me text{fill:white}.edge{stroke:#c9bead;fill:none;stroke-width:1}.edge.direct{stroke:#8f7654;stroke-width:2}.panel{position:absolute;right:0;top:0;width:min(420px,92vw);height:100%;background:#fffdf8;border-left:1px solid #ddd3c2;transform:translateX(101%);transition:.2s;overflow:auto;box-shadow:-8px 0 30px #0002}.panel.open{transform:none}.panel .head{padding:20px;border-bottom:1px solid #eee4d6}.panel .body{padding:18px 20px 32px}.summary{background:#f3eadc;padding:13px;border-radius:12px;line-height:1.75}.row{display:grid;grid-template-columns:90px 1fr;border-bottom:1px solid #eee4d6;padding:9px 0;font-size:13px;line-height:1.6}.k{color:#80776a}.close{float:right;border:0;background:transparent;font-size:22px}.badge{font-size:12px;color:#806b4e}.results{position:absolute;top:58px;left:260px;right:180px;max-height:320px;overflow:auto;background:white;border:1px solid #ddd3c2;border-radius:10px;display:none;z-index:10}.results.show{display:block}.res{padding:9px 12px;border-bottom:1px solid #eee;cursor:pointer}.res:hover{background:#f6f0e6}.loading{padding:30px;line-height:1.7}.hint{font-size:12px;color:#7b7267}@media(max-width:700px){.results{left:12px;right:12px;top:110px}header{align-items:flex-start}main{height:calc(100vh - 122px)}}</style></head><body><header><h1>李氏族谱 · 春位支系</h1><input id="q" placeholder="搜索姓名、字、号，例如：李懿 / 广懿 / 大元"><button id="me">定位李懿</button><button id="fit">总览</button><span class="hint">拖动浏览 · 滚轮缩放</span><div id="results" class="results"></div></header><main id="stage"><div class="loading" id="loading">正在加载族谱数据…</div><svg id="svg"></svg><aside id="panel" class="panel"><div class="head"><button class="close" id="close">×</button><div id="g" class="badge"></div><h2 id="name"></h2><div id="alias"></div></div><div id="body" class="body"></div></aside></main><script>
let DATA=[];const svg=document.getElementById('svg'),stage=document.getElementById('stage');let byId,children,pos,me,directSet,scale=.2,tx=40,ty=40;const NS='http://www.w3.org/2000/svg';
const PARTS=Array.from({length:8},(_,i)=>`./data/part-${String(i+1).padStart(2,'0')}.json`);
Promise.all(PARTS.map(u=>fetch(u).then(r=>{if(!r.ok)throw new Error(u+' '+r.status);return r.json()}))).then(parts=>{const rows=parts.flat();DATA=rows.map(r=>({id:r[0],gen:r[1],name:r[2],father_id:r[3]||'',mother:r[4]||'',birth:r[5]||'',birthplace:r[6]||'',address:r[7]||'',zi:r[8]||'',hao:r[9]||'',sex:r[10]||'',spouses:r[11]||''}));document.getElementById('loading').remove();init();}).catch(e=>document.getElementById('loading').innerHTML='数据加载失败，请刷新页面重试。<br><small>'+e+'</small>');
function init(){byId=new Map(DATA.map(d=>[d.id,d]));for(const d of DATA)d.father=d.father_id&&byId.has(d.father_id)?byId.get(d.father_id).name:'';children=new Map(DATA.map(d=>[d.id,[]]));for(const d of DATA)if(d.father_id&&byId.has(d.father_id))children.get(d.father_id).push(d.id);me=DATA.find(d=>d.gen===24&&d.name==='广懿');directSet=new Set();for(let x=me;x;x=x.father_id?byId.get(x.father_id):null)directSet.add(x.id);layout();render();fit();wire();}
function layout(){pos=new Map();let leaf=0;const roots=DATA.filter(d=>!d.father_id||!byId.has(d.father_id));function dfs(id){const k=children.get(id)||[];let x;if(!k.length)x=leaf++*100;else{const xs=k.map(dfs);x=(Math.min(...xs)+Math.max(...xs))/2}pos.set(id,{x,y:(byId.get(id).gen-14)*100});return x}for(const r of roots){dfs(r.id);leaf+=2}}
function render(){svg.innerHTML='';const g=document.createElementNS(NS,'g');g.setAttribute('transform',`translate(${tx},${ty}) scale(${scale})`);for(const d of DATA){if(!d.father_id||!byId.has(d.father_id))continue;const a=pos.get(d.father_id),b=pos.get(d.id),p=document.createElementNS(NS,'path');p.setAttribute('d',`M${a.x},${a.y+16} V${(a.y+b.y)/2} H${b.x} V${b.y-16}`);p.setAttribute('class','edge '+(directSet.has(d.id)&&directSet.has(d.father_id)?'direct':''));g.appendChild(p)}for(const d of DATA){const p=pos.get(d.id),ng=document.createElementNS(NS,'g');ng.setAttribute('class','node '+(d.id===me?.id?'me':directSet.has(d.id)?'direct':''));ng.setAttribute('transform',`translate(${p.x-42},${p.y-16})`);ng.style.cursor='pointer';const r=document.createElementNS(NS,'rect');r.setAttribute('width',84);r.setAttribute('height',32);const t=document.createElementNS(NS,'text');t.setAttribute('x',42);t.setAttribute('y',16);t.textContent=d.name;ng.append(r,t);ng.onclick=()=>openPerson(d.id);g.appendChild(ng)}svg.appendChild(g)}
function fit(){let xs=[...pos.values()].map(p=>p.x),ys=[...pos.values()].map(p=>p.y),w=stage.clientWidth,h=stage.clientHeight;let minX=Math.min(...xs)-60,maxX=Math.max(...xs)+60,minY=Math.min(...ys)-50,maxY=Math.max(...ys)+50;scale=Math.min((w-40)/(maxX-minX),(h-40)/(maxY-minY));tx=w/2-(minX+maxX)/2*scale;ty=h/2-(minY+maxY)/2*scale;render()}
function locate(id){const p=pos.get(id),w=stage.clientWidth,h=stage.clientHeight;scale=.9;tx=w/2-p.x*scale;ty=h/2-p.y*scale;render();openPerson(id)}
function year(s){if(!s)return '族谱未记载';if(s==='未详')return '族谱记为“不详”';const m={'〇':'0','零':'0','一':'1','二':'2','三':'3','四':'4','五':'5','六':'6','七':'7','八':'8','九':'9'};return s.replace(/[〇零一二三四五六七八九]{4}年/g,x=>x.slice(0,-1).split('').map(c=>m[c]||c).join('')+'年')}
function openPerson(id){const d=byId.get(id),panel=document.getElementById('panel');document.getElementById('g').textContent='第'+d.gen+'世';document.getElementById('name').textContent=id===me?.id?'李懿（族谱：广懿）':'李氏 · '+d.name;document.getElementById('alias').textContent=[d.zi?'字 '+d.zi:'',d.hao?'号 '+d.hao:'',d.sex||''].filter(Boolean).join(' · ');let s=(id===me?.id?'你在族谱中记作“广懿”。':'')+(d.father?'父亲是'+d.father+'。':'')+(d.mother?'母亲是'+d.mother+'。':'')+(d.birth?'出生时间记为'+year(d.birth)+'。':'族谱没有明确留下出生时间。')+(d.birthplace?'出生地记为'+d.birthplace+'。':'族谱没有明确记载出生地。')+(d.address?'族谱另外记录的通讯或居住地点是：'+d.address+'。':'');let rows=[['谱中姓名',d.name],['世代','第'+d.gen+'世'],['出生时间',year(d.birth)],['出生地',d.birthplace||'族谱未明确记载'],['父亲',d.father||'未记载'],['母亲',d.mother||'未记载'],['配偶',d.spouses||'未记载'],['通讯/居住',d.address||'未记载']];let h='<div class="summary">'+s+'</div>'+rows.map(x=>`<div class="row"><div class="k">${x[0]}</div><div>${x[1]}</div></div>`).join('');document.getElementById('body').innerHTML=h;panel.classList.add('open')}
function wire(){let drag=false,lx=0,ly=0;svg.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;svg.setPointerCapture(e.pointerId)});svg.addEventListener('pointermove',e=>{if(!drag)return;tx+=e.clientX-lx;ty+=e.clientY-ly;lx=e.clientX;ly=e.clientY;render()});svg.addEventListener('pointerup',()=>drag=false);svg.addEventListener('wheel',e=>{e.preventDefault();let f=Math.exp(-e.deltaY*.001);scale=Math.max(.005,Math.min(3,scale*f));render()},{passive:false});document.getElementById('fit').onclick=fit;document.getElementById('me').onclick=()=>me&&locate(me.id);document.getElementById('close').onclick=()=>document.getElementById('panel').classList.remove('open');const q=document.getElementById('q'),res=document.getElementById('results');q.oninput=()=>{let v=q.value.trim();if(!v){res.classList.remove('show');return}let a=DATA.filter(d=>(v==='李懿'&&d.id===me?.id)||[d.name,d.zi,d.hao,d.father,d.mother,d.spouses,d.address].filter(Boolean).join(' ').includes(v)).slice(0,30);res.innerHTML=a.map(d=>`<div class="res" data-id="${d.id}"><b>${d.id===me?.id?'李懿（广懿）':d.name}</b> · 第${d.gen}世${d.zi?' · 字 '+d.zi:''}</div>`).join('')||'<div class="res">没有找到</div>';res.classList.add('show');[...res.querySelectorAll('[data-id]')].forEach(x=>x.onclick=()=>{res.classList.remove('show');locate(x.dataset.id)})};}
</script></body></html>
